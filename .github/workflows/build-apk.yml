name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build YOSSEF Studio Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Native Android Project Matching Installed Flutter SDK
        run: |
          rm -rf android
          flutter create --platforms=android --org com.yossefhamed --project-name yossef_studio_pro .
          echo "android.newDsl=false" >> android/gradle.properties
          sed -i 's/android:label="[^"]*"/android:label="YOSSEF Studio Pro"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YOSSEF-Studio-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
